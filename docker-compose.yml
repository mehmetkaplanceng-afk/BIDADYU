version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: bidadyu-backend
    ports:
      - "5000:5000"
    volumes:
      - bidadyu-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/bidadyu.db
    restart: always
    networks:
      - bidadyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: bidadyu-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - bidadyu-network



volumes:
  bidadyu-data:

networks:
  bidadyu-network:
    driver: bridge
