version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: bidadyu-backend
    ports:
      - "5000:5000"
    volumes:
      - bidadyu-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/bidadyu.db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: bidadyu-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  agent:
    build:
      context: .
      dockerfile: src/agent/BIDADYUAgent/Dockerfile
    container_name: bidadyu-agent
    depends_on:
      - backend
    restart: always

volumes:
  bidadyu-data:
